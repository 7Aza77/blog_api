<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" width="100%" height="100%" style="background-color: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <linearGradient id="header-user" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="header-post" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="header-comment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="header-category" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="header-tag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="header-m2m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="circle" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#94a3b8" />
    </marker>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <text x="580" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">Blog API — Entity Relationship Diagram (ERD)</text>
  <text x="580" y="58" text-anchor="middle" fill="#94a3b8" font-size="13">Homework 1 • Django REST API Architecture</text>

  <g stroke="#64748b" stroke-width="1.8" fill="none" opacity="0.8">
    <path d="M 320 180 L 410 180" marker-start="url(#circle)" marker-end="url(#arrow)" />
    <path d="M 770 140 L 710 140" marker-start="url(#circle)" marker-end="url(#arrow)" />
    <path d="M 520 400 L 520 440" marker-start="url(#circle)" marker-end="url(#arrow)" />
    <path d="M 200 350 L 200 480 L 240 480" marker-start="url(#circle)" marker-end="url(#arrow)" />
    <path d="M 680 400 L 680 470" marker-start="url(#circle)" marker-end="url(#arrow)" />
    <path d="M 870 470 L 870 410" marker-start="url(#circle)" marker-end="url(#arrow)" />
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="80" width="280" height="270" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 40 90 A 10 10 0 0 1 50 80 L 310 80 A 10 10 0 0 1 320 90 L 320 118 L 40 118 Z" fill="url(#header-user)" />
    <text x="55" y="105" fill="#ffffff" font-size="14" font-weight="700">auths.User</text>
    <text x="305" y="105" text-anchor="end" fill="#c7d2fe" font-size="11">AbstractBaseUser</text>

    <text x="55" y="140" fill="#f8fafc" font-size="12" font-weight="600">PK  id</text>
    <text x="305" y="140" text-anchor="end" fill="#94a3b8" font-size="12">BigAutoField</text>
    <line x1="50" y1="150" x2="310" y2="150" stroke="#334155" stroke-width="1" />

    <text x="55" y="170" fill="#38bdf8" font-size="12" font-weight="600">UQ  email</text>
    <text x="305" y="170" text-anchor="end" fill="#94a3b8" font-size="12">EmailField (login)</text>

    <text x="55" y="195" fill="#f8fafc" font-size="12">    first_name</text>
    <text x="305" y="195" text-anchor="end" fill="#94a3b8" font-size="12">CharField(50)</text>

    <text x="55" y="220" fill="#f8fafc" font-size="12">    last_name</text>
    <text x="305" y="220" text-anchor="end" fill="#94a3b8" font-size="12">CharField(50)</text>

    <text x="55" y="245" fill="#f8fafc" font-size="12">    is_active</text>
    <text x="305" y="245" text-anchor="end" fill="#94a3b8" font-size="12">BooleanField (True)</text>

    <text x="55" y="270" fill="#f8fafc" font-size="12">    is_staff</text>
    <text x="305" y="270" text-anchor="end" fill="#94a3b8" font-size="12">BooleanField (False)</text>

    <text x="55" y="295" fill="#64748b" font-size="12">    password</text>
    <text x="305" y="295" text-anchor="end" fill="#94a3b8" font-size="12">CharField(128)</text>

    <text x="55" y="320" fill="#64748b" font-size="12">    last_login</text>
    <text x="305" y="320" text-anchor="end" fill="#94a3b8" font-size="12">DateTimeField (null)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="410" y="80" width="300" height="320" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 410 90 A 10 10 0 0 1 420 80 L 700 80 A 10 10 0 0 1 710 90 L 710 118 L 410 118 Z" fill="url(#header-post)" />
    <text x="425" y="105" fill="#ffffff" font-size="14" font-weight="700">blog.Post</text>
    <text x="695" y="105" text-anchor="end" fill="#bae6fd" font-size="11">Model</text>

    <text x="425" y="140" fill="#f8fafc" font-size="12" font-weight="600">PK  id</text>
    <text x="695" y="140" text-anchor="end" fill="#94a3b8" font-size="12">BigAutoField</text>
    <line x1="420" y1="150" x2="700" y2="150" stroke="#334155" stroke-width="1" />

    <text x="425" y="170" fill="#a78bfa" font-size="12" font-weight="600">FK  author_id</text>
    <text x="695" y="170" text-anchor="end" fill="#94a3b8" font-size="12">FK -&gt; auths.User</text>

    <text x="425" y="195" fill="#a78bfa" font-size="12" font-weight="600">FK  category_id</text>
    <text x="695" y="195" text-anchor="end" fill="#94a3b8" font-size="12">FK -&gt; Category (null)</text>

    <text x="425" y="220" fill="#f8fafc" font-size="12">    title</text>
    <text x="695" y="220" text-anchor="end" fill="#94a3b8" font-size="12">CharField(200)</text>

    <text x="425" y="245" fill="#38bdf8" font-size="12" font-weight="600">UQ  slug</text>
    <text x="695" y="245" text-anchor="end" fill="#94a3b8" font-size="12">SlugField(200)</text>

    <text x="425" y="270" fill="#f8fafc" font-size="12">    body</text>
    <text x="695" y="270" text-anchor="end" fill="#94a3b8" font-size="12">TextField</text>

    <text x="425" y="295" fill="#f8fafc" font-size="12">    status</text>
    <text x="695" y="295" text-anchor="end" fill="#94a3b8" font-size="12">Choices(draft/pub)</text>

    <text x="425" y="320" fill="#f8fafc" font-size="12">    created_at</text>
    <text x="695" y="320" text-anchor="end" fill="#94a3b8" font-size="12">DateTimeField(auto_now_add)</text>

    <text x="425" y="345" fill="#f8fafc" font-size="12">    updated_at</text>
    <text x="695" y="345" text-anchor="end" fill="#94a3b8" font-size="12">DateTimeField(auto_now)</text>

    <text x="425" y="375" fill="#34d399" font-size="12">M2M tags</text>
    <text x="695" y="375" text-anchor="end" fill="#94a3b8" font-size="12">M2M -&gt; blog.Tag</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="80" width="280" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 770 90 A 10 10 0 0 1 780 80 L 1040 80 A 10 10 0 0 1 1050 90 L 1050 118 L 770 118 Z" fill="url(#header-category)" />
    <text x="785" y="105" fill="#ffffff" font-size="14" font-weight="700">blog.Category</text>
    <text x="1035" y="105" text-anchor="end" fill="#fde68a" font-size="11">Model</text>

    <text x="785" y="140" fill="#f8fafc" font-size="12" font-weight="600">PK  id</text>
    <text x="1035" y="140" text-anchor="end" fill="#94a3b8" font-size="12">BigAutoField</text>
    <line x1="780" y1="150" x2="1040" y2="150" stroke="#334155" stroke-width="1" />

    <text x="785" y="175" fill="#38bdf8" font-size="12" font-weight="600">UQ  name</text>
    <text x="1035" y="175" text-anchor="end" fill="#94a3b8" font-size="12">CharField(100)</text>

    <text x="785" y="205" fill="#38bdf8" font-size="12" font-weight="600">UQ  slug</text>
    <text x="1035" y="205" text-anchor="end" fill="#94a3b8" font-size="12">SlugField(100)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="260" width="280" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 770 270 A 10 10 0 0 1 780 260 L 1040 260 A 10 10 0 0 1 1050 270 L 1050 298 L 770 298 Z" fill="url(#header-tag)" />
    <text x="785" y="285" fill="#ffffff" font-size="14" font-weight="700">blog.Tag</text>
    <text x="1035" y="285" text-anchor="end" fill="#ddd6fe" font-size="11">Model</text>

    <text x="785" y="320" fill="#f8fafc" font-size="12" font-weight="600">PK  id</text>
    <text x="1035" y="320" text-anchor="end" fill="#94a3b8" font-size="12">BigAutoField</text>
    <line x1="780" y1="330" x2="1040" y2="330" stroke="#334155" stroke-width="1" />

    <text x="785" y="355" fill="#38bdf8" font-size="12" font-weight="600">UQ  name</text>
    <text x="1035" y="355" text-anchor="end" fill="#94a3b8" font-size="12">CharField(50)</text>

    <text x="785" y="385" fill="#38bdf8" font-size="12" font-weight="600">UQ  slug</text>
    <text x="1035" y="385" text-anchor="end" fill="#94a3b8" font-size="12">SlugField(50)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="240" y="440" width="300" height="210" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 240 450 A 10 10 0 0 1 250 440 L 530 440 A 10 10 0 0 1 540 450 L 540 478 L 240 478 Z" fill="url(#header-comment)" />
    <text x="255" y="465" fill="#ffffff" font-size="14" font-weight="700">blog.Comment</text>
    <text x="525" y="465" text-anchor="end" fill="#99f6e4" font-size="11">Model</text>

    <text x="255" y="500" fill="#f8fafc" font-size="12" font-weight="600">PK  id</text>
    <text x="525" y="500" text-anchor="end" fill="#94a3b8" font-size="12">BigAutoField</text>
    <line x1="250" y1="510" x2="530" y2="510" stroke="#334155" stroke-width="1" />

    <text x="255" y="530" fill="#a78bfa" font-size="12" font-weight="600">FK  post_id</text>
    <text x="525" y="530" text-anchor="end" fill="#94a3b8" font-size="12">FK -&gt; blog.Post</text>

    <text x="255" y="555" fill="#a78bfa" font-size="12" font-weight="600">FK  author_id</text>
    <text x="525" y="555" text-anchor="end" fill="#94a3b8" font-size="12">FK -&gt; auths.User</text>

    <text x="255" y="580" fill="#f8fafc" font-size="12">    body</text>
    <text x="525" y="580" text-anchor="end" fill="#94a3b8" font-size="12">TextField</text>

    <text x="255" y="605" fill="#f8fafc" font-size="12">    created_at</text>
    <text x="525" y="605" text-anchor="end" fill="#94a3b8" font-size="12">DateTimeField(auto_now_add)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="470" width="280" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 630 480 A 10 10 0 0 1 640 470 L 900 470 A 10 10 0 0 1 910 480 L 910 508 L 630 508 Z" fill="url(#header-m2m)" />
    <text x="645" y="495" fill="#ffffff" font-size="14" font-weight="700">blog.Post_tags</text>
    <text x="895" y="495" text-anchor="end" fill="#cbd5e1" font-size="11">Through Table</text>

    <text x="645" y="530" fill="#f8fafc" font-size="12" font-weight="600">PK  id</text>
    <text x="895" y="530" text-anchor="end" fill="#94a3b8" font-size="12">BigAutoField</text>
    <line x1="640" y1="540" x2="900" y2="540" stroke="#334155" stroke-width="1" />

    <text x="645" y="565" fill="#a78bfa" font-size="12" font-weight="600">FK  post_id</text>
    <text x="895" y="565" text-anchor="end" fill="#94a3b8" font-size="12">FK -&gt; blog.Post</text>

    <text x="645" y="595" fill="#a78bfa" font-size="12" font-weight="600">FK  tag_id</text>
    <text x="895" y="595" text-anchor="end" fill="#94a3b8" font-size="12">FK -&gt; blog.Tag</text>
  </g>

  <g transform="translate(60, 685)">
    <rect x="0" y="0" width="1040" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="25" fill="#94a3b8" font-size="12">Legend:</text>
    <text x="80" y="25" fill="#f8fafc" font-weight="600" font-size="12">PK</text>
    <text x="105" y="25" fill="#94a3b8" font-size="12">Primary Key</text>
    <text x="200" y="25" fill="#a78bfa" font-weight="600" font-size="12">FK</text>
    <text x="225" y="25" fill="#94a3b8" font-size="12">Foreign Key</text>
    <text x="320" y="25" fill="#38bdf8" font-weight="600" font-size="12">UQ</text>
    <text x="345" y="25" fill="#94a3b8" font-size="12">Unique</text>
    <text x="410" y="25" fill="#34d399" font-weight="600" font-size="12">M2M</text>
    <text x="445" y="25" fill="#94a3b8" font-size="12">Many to Many</text>
    <text x="560" y="25" fill="#cbd5e1" font-size="12">Relations: 1:N (User -&gt; Posts, Comments; Post -&gt; Comments; Category -&gt; Posts), M:N (Post &lt;-&gt; Tag)</text>
  </g>
</svg>
