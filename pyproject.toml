[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF012", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "settings"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
